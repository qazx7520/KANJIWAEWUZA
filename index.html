<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f9">
<title>칸지외우자</title>
<style>
:root {font-family:system-ui,-apple-system,'Noto Sans KR','Noto Sans JP',sans-serif;color-scheme:light;--ink:#202639;--sub:#717889;--primary:#314b83;--stroke:#dfe3ec;--bg:#f5f6f9}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--ink)}
button,select {font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible {outline:3px solid #9ab9fa;outline-offset:2px}
.wrap {max-width:720px;margin:auto;padding:25px 18px 48px}
.eyebrow {font-size:13px;color:var(--primary);font-weight:750;letter-spacing:.08em;margin-bottom:5px}
h1 {font-size:clamp(24px,5.5vw,31px);margin:0 0 9px;letter-spacing:-.04em}
.intro {color:var(--sub);margin:0 0 25px;font-size:12px;line-height:1.6}
.section-title {font-weight:750;font-size:15px;margin:0 0 11px}
.courses {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
.personal-courses{grid-template-columns:1fr;margin-bottom:22px}
.personal-courses .course{min-height:105px}
.students-heading{margin-top:3px}

.course {text-align:left;background:white;border:2px solid var(--stroke);border-radius:18px;padding:18px 16px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s}
.course.active {border-color:var(--primary);background:#f0f4ff;box-shadow:0 4px 16px #243e7711}
.course-name {font-size:16px;font-weight:800;line-height:1.4;word-break:keep-all}
.course-desc {color:#6e778a;font-size:12px;line-height:1.45}
.course-count {color:var(--primary);font-weight:750;font-size:12px}
.section-head {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.selected-title {font-size:19px;font-weight:800;margin:0;line-height:1.4}
.selected-subtitle {font-size:13px;color:var(--sub);margin:5px 0 16px;line-height:1.5}
.filters {display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.filters select {background:white;border:1px solid var(--stroke);border-radius:11px;padding:12px 10px;width:100%;min-width:0;color:var(--ink);font-size:14px}
.student-picker {display:block;width:100%;margin:0 0 20px;padding:16px 14px;background:#fff;border:1px solid var(--stroke);border-radius:13px;color:var(--ink);font-size:16px}
.filters #orderMode {grid-column:auto}
.panel {background:white;border-radius:22px;padding:24px;box-shadow:0 5px 25px #192c4e0b}
.top {display:flex;align-items:center;justify-content:space-between;gap:9px}
.topright {display:flex;align-items:center;gap:11px}
.stats {color:#7b8290;font-size:13px;line-height:1.5}
.star {width:47px;height:47px;border-radius:50%;padding:0;border:2px solid #dcdfe7;background:white;color:#aab0bd;font-size:27px;display:grid;place-items:center;line-height:1}
.star.active {color:#df9e00;background:#fff5c9;border-color:#e8c34a}
.star:disabled {opacity:.38;cursor:default}
.bar {height:7px;border-radius:9px;background:#e8ebf1;margin:18px 0;overflow:hidden}
.fill {height:100%;width:0;background:#4b67a0;border-radius:9px;transition:width .18s}
.word {min-height:186px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;margin:12px 0 8px;overflow-wrap:anywhere}
.reading-line {font-size:clamp(20px,5vw,29px);color:#3457a0;line-height:1.3;min-height:38px;letter-spacing:.04em;font-weight:500}
.reading-line.hidden {visibility:hidden}
.kanji-line {font-size:clamp(42px,9.7vw,78px);line-height:1.35;font-weight:780;max-width:100%}
.kanji-line.long{font-size:clamp(32px,7vw,54px)}
.kanji-line.xlong{font-size:clamp(26px,6vw,39px)}
.meaning {min-height:68px;font-size:clamp(19px,5vw,25px);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;padding:4px 10px}
.buttons {display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.action {padding:14px 9px;min-height:54px;background:white;color:var(--ink);border:1px solid var(--stroke);border-radius:12px;font-size:15px;font-weight:650}
.action.primary {background:var(--primary);color:white;border:1px solid var(--primary)}
.action:disabled {opacity:.4;cursor:default}
#startNext{background:#252d44;color:#fff;border:0;border-radius:12px;min-height:54px;padding:14px;font-size:16px;font-weight:750;cursor:pointer}
.hint {font-size:12px;color:#858b97;text-align:center;line-height:1.7;margin:16px 0 0}
.empty {padding:38px 22px;text-align:center;background:white;border-radius:20px;border:1px dashed #cbd2df}
.empty .emoji {font-size:37px;margin-bottom:14px}
.empty h3 {font-size:19px;margin:0 0 8px}
.empty p {color:#6f7686;font-size:14px;line-height:1.7;margin:0}
.hidden-ui {display:none !important}
.foot {font-size:12px;color:#9098a8;text-align:center;margin:20px 0 0;line-height:1.6}
@media(max-width:480px){.wrap{padding:17px 12px 34px}.intro{margin-bottom:20px}.courses{gap:8px;margin-bottom:20px}.course{padding:14px 11px;min-height:134px;border-radius:15px}.course-name{font-size:14px}.personal-courses .course{min-height:102px}.kanji-line.long{font-size:clamp(29px,7vw,43px)}.kanji-line.xlong{font-size:clamp(23px,5.7vw,34px)}.course-desc{font-size:11px}.selected-title{font-size:17px}.panel{padding:19px 14px;border-radius:18px}.filters select{font-size:13px;padding:12px 8px}.word{min-height:173px;gap:26px}.meaning{min-height:72px}.stats{font-size:12px}.topright{gap:7px}.star{width:44px;height:44px;min-width:44px}.action{font-size:14px;padding:12px 5px}.hint{font-size:11px}}
[hidden]{display:none!important}</style>
</head>

          <option value="random">🔀 순서 섞기</option>
        </select>
      </div>
      <div class="panel"><div id="retryPrompt" hidden style="text-align:center;padding:28px 12px">
<div style="font-size:38px;margin-bottom:10px">📖</div>
<h2 style="font-size:23px;margin:0 0 10px">못 외운 단어를 다시 외워봐요!</h2>
<p style="color:#697386;line-height:1.6">이번에 다시 볼 단어가 <strong id="retryCount">0</strong>개 있어요.<br>준비되면 이어서 공부해요.</p>
<button class="primary" id="beginRetry" type="button" style="width:100%;margin-top:12px">다시 외우기</button>
</div><div id="roundInfo" style="font-weight:750;color:#3655a0;margin-bottom:10px" aria-live="polite">1회독 · 1차 학습</div><div id="roundDone" hidden style="text-align:center;padding:28px 8px"><div style="font-size:36px">🎉</div><h2 id="roundDoneTitle">1회독 끝!</h2><p id="roundDoneText">모든 단어를 외웠어요.</p><button class="primary" id="startNext" type="button" style="width:100%;margin-top:10px">2회독 시작</button></div><div id="studyContent">
        <div class="top"><span class="stats" id="count"></span><div class="topright"><span class="stats" id="score"></span><button class="star" id="star" type="button" aria-label="즐겨찾기 추가" aria-pressed="false" title="즐겨찾기">★</button></div></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="word" id="word"></div>
        <div class="meaning" id="meaning" aria-live="polite"></div>
        <div class="buttons">
          <button class="action" id="showReading" type="button">후리가나 보기</button><button class="action" id="showMeaning" type="button">한국어 뜻 보기</button>
          <button class="action" id="wrong" type="button">✕ 다시 외우기</button><button class="action primary" id="known" type="button">✓ 외웠음</button>
        </div>
        <p class="hint">외웠음 → 이번 회독에서 제외 · 다시 외우기 → 이번 차례가 끝난 뒤 재출제<br>전체 단어를 외워야만 다음 회독으로 넘어갑니다.</p>
      </div></div>
    </div>
    <div id="emptyArea" class="empty hidden-ui" role="status">
      <div class="emoji">📝</div><h3>학습할 단어가 없어요</h3><p>다른 과를 선택해 주세요.</p>
    </div>
  </section>
  <div style="text-align:center;margin:16px 0 0"><button id="resetProgress" type="button" style="background:transparent;border:0;color:#858b97;font-size:12px;cursor:pointer;padding:12px">현재 과목 학습 기록 초기화</button></div>
  <p class="foot">학습 기록과 즐겨찾기는 과목별로 이 브라우저에 저장됩니다.</p>
</main>

const storageRemove=k=>{try{localStorage.removeItem(k)}catch{}};
const readStore=k=>{try{return JSON.parse(storageGet(k)||'null')}catch{return null}};
const saveStore=(k,v)=>storageSet(k,JSON.stringify(v));
const key=d=>d[1]+'|'+d[2];
// 모든 단어의 읽기는 히라가나로 직접 저장됩니다.
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// 이 버전은 기존 오류가 있던 암기/회독 기록을 가져오지 않습니다.
// 최초 실행 시 이전 버전의 학습 기록만 삭제합니다. 즐겨찾기는 유지합니다.
if(storageGet('kanjiCycleV5Cleaned')!=='yes'){
 for(const k of ['kanjiMarks','kanjiMarks_stu12','kanjiMarks_stu13','kanjiMarks_stu18','kanjiMarks_stu19',
  'kanjiRoundState_v2_jinwoo','kanjiRoundState_v2_student12','kanjiRoundState_v2_student13',
  'kanjiRoundState_v2_student18','kanjiRoundState_v2_student19'])storageRemove(k);
 storageSet('kanjiCycleV5Cleaned','yes');
}
const progressKey=id=>'kanjiCycleV5_'+id;
const initialState=(id,round=1)=>{
 const ids=courses[id].data.map((_,i)=>i);
 if(storageGet('kanjiOrderMode')==='random')shuffle(ids);
 return {round,pass:1,passTotal:ids.length,queue:ids,failed:[],mastered:[],completed:ids.length===0,awaitingRetry:false};
};
function validState(s,id){
 if(!s||!Number.isInteger(s.round)||s.round<1||!Number.isInteger(s.pass)||s.pass<1||
 !Array.isArray(s.queue)||!Array.isArray(s.failed)||!Array.isArray(s.mastered)||
 !Number.isInteger(s.passTotal)||s.passTotal<0||typeof s.completed!=='boolean')return false;
 const size=courses[id].data.length;
 const all=[...s.queue,...s.failed,...s.mastered];
 return all.length===size && new Set(all).size===size && all.every(x=>Number.isInteger(x)&&x>=0&&x<size);
}
let active=storageGet('kanjiSelectedCourse');
if(!Object.prototype.hasOwnProperty.call(courses,active))active='jinwoo';
let state, favorites={}, selectedId=null;
function saveState(){saveStore(progressKey(active),state)}
function selectCourse(id){
 if(!Object.prototype.hasOwnProperty.call(courses,id))return;
 active=id;
 storageSet('kanjiSelectedCourse',id);
 const c=courses[id];
 favorites=readStore(c.favoritesKey)||{};
 let saved=readStore(progressKey(id));
 state=validState(saved,id)?saved:initialState(id);
 if(typeof state.awaitingRetry!=='boolean')state.awaitingRetry=state.queue.length===0&&state.failed.length>0;
 saveState();
 $('selectedTitle').textContent=c.title;
 $('selectedSubtitle').textContent=c.subtitle;
 $('coursePicker').value=id;
 $('mode').value='all';
 $('studyArea').classList.toggle('hidden-ui',!c.data.length);
 $('emptyArea').classList.toggle('hidden-ui',!!c.data.length);
 render();
}
function visibleId(){
 const mode=$('mode').value;
 const q=state.queue;
 if(mode==='favorite')return q.find(i=>favorites[key(courses[active].data[i])]);
 if(mode==='wrong')return q.find(i=>state.pass>1 || (state.wrongEver||[]).includes(i));
 return q[0];
}
function render(){
 const c=courses[active],total=c.data.length;
 const done=state.completed, waiting=!!state.awaitingRetry;
 $('roundDone').hidden=!done;
 $('retryPrompt').hidden=!waiting;
 $('studyContent').hidden=done||waiting;
 $('roundInfo').textContent=`${state.round}회독`;
 if(done){
   $('roundDoneTitle').textContent=`${state.round}회독 끝! 🎉`;
   $('roundDoneText').textContent=`${total}개 단어를 모두 외웠어요.`;
   $('startNext').textContent=`${state.round+1}회독 시작`;
   return;
 }
 if(waiting){
   $('retryCount').textContent=state.failed.length;
   return;
 }
 selectedId=visibleId();
 const d=selectedId===undefined?null:c.data[selectedId];
 $('word').replaceChildren();$('meaning').textContent='';
 $('showReading').textContent='후리가나 보기';$('showMeaning').textContent='한국어 뜻 보기';
 if(d){
   const r=document.createElement('div');r.className='reading-line hidden';r.textContent=d[2];
   const w=document.createElement('div');w.className='kanji-line';
   if(d[1].length>=15)w.classList.add('xlong');else if(d[1].length>=9)w.classList.add('long');
   w.textContent=d[1];$('word').append(r,w);
 }else{
   const msg=document.createElement('div');msg.style.cssText='font-size:17px;color:#81899a;line-height:1.6';
   msg.textContent=$('mode').value==='favorite'?'현재 차례에 남은 즐겨찾기 단어가 없어요. 전체 단어를 선택해 주세요.':
     $('mode').value==='wrong'?'현재 차례에 다시 볼 단어가 없어요. 전체 단어를 선택해 주세요.':'이번 차례의 단어가 없어요.';
   $('word').append(msg);
 }
 const on=!!(d&&favorites[key(d)]);
 $('star').classList.toggle('active',on);
 $('star').setAttribute('aria-pressed',String(on));
 $('star').setAttribute('aria-label',on?'즐겨찾기 해제':'즐겨찾기 추가');
 $('count').textContent=`${state.passTotal-state.queue.length+1} / ${state.passTotal}`;
 $('score').textContent=`외운 단어 ${state.mastered.length}/${total}`;
 $('fill').style.width=`${total?state.mastered.length/total*100:0}%`;
 for(const name of ['showReading','showMeaning','wrong','known','star'])$(name).disabled=!d;
}
function mark(status){
 const id=visibleId();if(id===undefined || state.completed || state.awaitingRetry)return;
 // 필터로 중간 단어를 선택해도 다른 단어의 순서는 보존됩니다.
 const pos=state.queue.indexOf(id);if(pos<0)return;
 state.queue.splice(pos,1);
 if(status==='known')state.mastered.push(id);
 else {
  state.failed.push(id);
  if(!Array.isArray(state.wrongEver))state.wrongEver=[];
  if(!state.wrongEver.includes(id))state.wrongEver.push(id);
 }
 // 핵심: 이번 차례를 끝낸 후에만 '다시 외우기' 단어들을 다음 차례로 보냅니다.
 if(state.queue.length===0){
   if(state.failed.length){
     state.awaitingRetry=true;
   }else if(state.mastered.length===courses[active].data.length){
     state.completed=true;
   }
 }
 saveState();render();
}
$('beginRetry').onclick=()=>{
 if(!state.awaitingRetry||!state.failed.length)return;
 state.queue=[...state.failed];state.failed=[];state.pass++;
 state.passTotal=state.queue.length;state.awaitingRetry=false;
 if($('orderMode').value==='random')shuffle(state.queue);
 $('mode').value='all';saveState();render();
};
$('known').onclick=()=>mark('known');
$('wrong').onclick=()=>mark('wrong');
$('startNext').onclick=()=>{
 if(!state.completed)return;
 state=initialState(active,state.round+1);
 saveState();$('mode').value='all';render();
};
$('showReading').onclick=()=>{
 const r=$('word').querySelector('.reading-line');if(!r)return;
 r.classList.toggle('hidden');
 $('showReading').textContent=r.classList.contains('hidden')?'후리가나 보기':'후리가나 숨기기';
};
$('showMeaning').onclick=()=>{
 const id=visibleId();if(id===undefined)return;
 const showing=!!$('meaning').textContent;
 $('meaning').textContent=showing?'':courses[active].data[id][3];
 $('showMeaning').textContent=showing?'한국어 뜻 보기':'한국어 뜻 숨기기';
};
$('star').onclick=()=>{
 const id=visibleId();if(id===undefined)return;
 const k=key(courses[active].data[id]);
 if(favorites[k])delete favorites[k];else favorites[k]=true;
 saveStore(courses[active].favoritesKey,favorites);
 render();
};
$('mode').onchange=render;
$('orderMode').onchange=()=>{
 const mode=$('orderMode').value;
 storageSet('kanjiOrderMode',mode);
 if(mode==='random')shuffle(state.queue);else state.queue.sort((a,b)=>a-b);
 saveState();render();
};
$('coursePicker').onchange=()=>selectCourse($('coursePicker').value);
$('resetProgress').onclick=()=>{
 if(!confirm(`「${courses[active].title}」의 현재 회독 기록을 모두 지우고 1회독부터 다시 시작할까요?`))return;
 state=initialState(active);saveState();$('mode').value='all';render();
};
$('orderMode').value=storageGet('kanjiOrderMode')==='random'?'random':'ordered';
selectCourse(active);
</script></body></html>
